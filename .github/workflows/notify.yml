name: Notificari
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Trimite notificari
        env:
          DB_URL: ${{ secrets.DB_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, json, datetime as d
          import urllib.request as u
          from zoneinfo import ZoneInfo
          now = d.datetime.now(ZoneInfo("Europe/Bucharest"))
          t = now.date()
          mk = f"{t.year}-{t.month:02d}"
          manual = os.environ.get("EVENT") == "workflow_dispatch"
          if not manual and not 8 <= now.hour <= 21:
              print("in afara intervalului 08-22")
              raise SystemExit
          j = json.load(u.urlopen(os.environ["DB_URL"] + "/crm.json")) or {}
          m = []
          if now.hour == 8:
              for p in j.get("people", []):
                  b = p.get("bd")
                  if not b:
                      continue
                  _, mo, da = map(int, b.split("-"))
                  for k, w in ((0, "azi"), (1, "mâine")):
                      x = t + d.timedelta(days=k)
                      if (x.month, x.day) == (mo, da):
                          m.append(f"🎂 {p['name']} are ziua de naștere {w}")
          for r in j.get("rem", []):
              ds = r.get("days") or ([r["day"]] if r.get("day") else [])
              if isinstance(ds, dict):
                  ds = list(ds.values())
              dn = r.get("done") or {}
              if isinstance(dn, str):
                  dn = {dn: ds}
              md = dn.get(mk) or []
              if isinstance(md, dict):
                  md = list(md.values())
              md = [int(x) for x in md if x is not None]
              for day in ds:
                  if day is not None and int(day) <= t.day and int(day) not in md:
                      m.append(f"⏰ {r['text']} (ziua {day}, bifează în aplicație)")
          if m:
              req = u.Request("https://ntfy.sh/" + os.environ["NTFY_TOPIC"], "\n".join(m).encode("utf-8"), {"Title": "Mini-CRM"})
              u.urlopen(req)
          print(m or "nimic de trimis")
          nw = j.get("news") or {}
          if manual or (nw.get("on") and now.hour == int(nw.get("hour", 8))):
              import xml.etree.ElementTree as ET
              import urllib.parse as up
              tops = [x.strip() for x in str(nw.get("topics", "")).split(",") if x.strip()][:5] or [""]
              items, seen = [], set()
              for tp in tops:
                  if tp:
                      url = "https://news.google.com/rss/search?q=" + up.quote(tp + " when:1d") + "&hl=ro&gl=RO&ceid=RO:ro"
                  else:
                      url = "https://news.google.com/rss?hl=ro&gl=RO&ceid=RO:ro"
                  try:
                      raw = u.urlopen(u.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=25).read()
                      for it in ET.fromstring(raw).findall(".//item")[:4]:
                          ti = (it.findtext("title") or "").strip()
                          if ti and ti not in seen:
                              seen.add(ti)
                              items.append((tp or "Principale", ti, it.findtext("link") or ""))
                  except Exception as e:
                      print("eroare feed", tp, e)
              body = ""
              key = os.environ.get("ANTHROPIC_API_KEY")
              if key and items:
                  try:
                      txt = "\n".join(f"[{a}] {b}" for a, b, _ in items)
                      req = u.Request("https://api.anthropic.com/v1/messages", json.dumps({
                          "model": "claude-haiku-5-5", "max_tokens": 700,
                          "messages": [{"role": "user", "content": "Iată titlurile știrilor de azi. Scrie în română un rezumat scurt, 5-7 puncte, fiecare pe un rând care începe cu •, fără introducere. Folosește doar informațiile din titluri.\n\n" + txt}]
                      }).encode("utf-8"), {"x-api-key": key, "anthropic-version": "2023-06-01", "content-type": "application/json"})
                      body = json.load(u.urlopen(req, timeout=60))["content"][0]["text"].strip()
                  except Exception as e:
                      print("eroare rezumat AI", e)
              if items:
                  dg = {"date": now.strftime("%d.%m.%Y %H:%M"), "summary": body,
                        "items": [{"t": a, "title": b, "link": c} for a, b, c in items]}
                  try:
                      u.urlopen(u.Request(os.environ["DB_URL"] + "/crm/digest.json", json.dumps(dg).encode("utf-8"),
                                          {"Content-Type": "application/json"}, method="PUT"))
                  except Exception as e:
                      print("eroare salvare stiri", e)
                  u.urlopen(u.Request("https://ntfy.sh/" + os.environ["NTFY_TOPIC"], "📰 Știrile de azi sunt gata. Deschide aplicația.".encode("utf-8"),
                                      {"Title": "Stiri de azi", "Click": os.environ.get("APP_URL", "https://serbaniulian-cmd.github.io/Mini_CRM/")}))
              print("stiri:", len(items), "titluri")
          PY
      - name: Tine repo-ul activ
        run: |
          if [ "$(date -u +%d%H)" = "0105" ]; then
            git config user.name "crm-bot"
            git config user.email "crm-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
